<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Ashe Ra</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #F5F0EA;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a5a3f;
    }
    .card {
      background: rgba(255,255,255,0.92);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(122,158,126,0.18);
      padding: 48px 40px;
      max-width: 420px;
      text-align: center;
    }
    .logo { font-size: 40px; margin-bottom: 12px; color: #7A9E7E; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 28px;
      color: #4A7050;
      margin: 0 0 12px;
    }
    p { color: #5f8b66; line-height: 1.6; font-size: 15px; margin: 0 0 24px; }
    .affirmation {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      color: #7A9E7E;
      font-size: 17px;
      border-top: 1px solid #dde9de;
      padding-top: 20px;
      margin-top: 8px;
    }
    button {
      background: linear-gradient(135deg, #7A9E7E, #4A7050);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 13px 28px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✿</div>
    <h1>You're offline</h1>
    <p>
      Your connection wandered for a moment — that's okay. Your body doesn't need
      Wi-Fi to be worth listening to.
    </p>
    <button onclick="location.reload()">Try again</button>
    <div class="affirmation">
      "Rest is not laziness — it is repair."
    </div>
  </div>
</body>
</html>
